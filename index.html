<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز ميكروباص</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        /* تصميم خريطة الميكروباص */
        .van-layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
        }
        .seat {
            padding: 15px 5px;
            background: #28a745; /* أخضر = متاح */
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .seat.occupied { background: #dc3545; cursor: not-allowed; } /* أحمر = محجوز */
        .seat.selected { background: #ffc107; color: #000; } /* أصفر = محدد حالياً */
        .driver { background: #6c757d; grid-column: span 3; color: white; padding: 10px; border-radius: 6px; }
        .btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>تطبيق حجز الميكروباص</h2>
    
    <!-- زرار البحث عن الأجهزة القريبة -->
    <button class="btn" onclick="scanNearbyVan()">ابحث عن الميكروباص القريب (BLE)</button>
    <p id="status-text" style="color: #666; font-size: 14px;">اضغط للبحث عن أقرب ميكروباص...</p>

    <!-- خريطة المقاعد -->
    <div class="van-layout" id="van-map" style="display: none;">
        <div class="driver">السائق 🚍</div>
        
        <!-- صفوف الكراسي الـ 14 -->
        <div class="seat" onclick="toggleSeat(this)">1</div>
        <div class="seat" onclick="toggleSeat(this)">2</div>
        <div class="seat" onclick="toggleSeat(this)">3</div>
        
        <div class="seat" onclick="toggleSeat(this)">4</div>
        <div class="seat" onclick="toggleSeat(this)">5</div>
        <div class="seat" onclick="toggleSeat(this)">6</div>

        <div class="seat" onclick="toggleSeat(this)">7</div>
        <div class="seat" onclick="toggleSeat(this)">8</div>
        <div class="seat" onclick="toggleSeat(this)">9</div>

        <div class="seat" onclick="toggleSeat(this)">10</div>
        <div class="seat" onclick="toggleSeat(this)">11</div>
        <div class="seat" onclick="toggleSeat(this)">12</div>

        <div class="seat" onclick="toggleSeat(this)">13</div>
        <div class="seat" onclick="toggleSeat(this)">14</div>
    </div>

    <button class="btn" id="pay-btn" style="display: none; background: #198754;" onclick="goToPayment()">الانتقال للدفع</button>
</div>

<script>
    // وظيفة الـ Web Bluetooth للمتصفح
    async function scanNearbyVan() {
        const status = document.getElementById('status-text');
        status.innerText = "جاري البحث عن أجهزة البلوتوث القريبة...";
        
        try {
            // طلب الاتصال بأجهزة BLE القريبة
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true
            });
            
            status.innerText = `تم الاتصال بميكروباص: ${device.name || 'ميكروباص غير مسمى'}`;
            document.getElementById('van-map').style.display = 'grid';
            document.getElementById('pay-btn').style.display = 'block';
        } catch (error) {
            status.innerText = "تعذر العثور على جهاز قريب أو تم إلقاء البحث.";
            console.error(error);
        }
    }

    function toggleSeat(element) {
        if (element.classList.contains('occupied')) return;
        element.classList.toggle('selected');
    }

    function goToPayment() {
        alert("سيتم تحويلك لصفحة الدفع وسداد قيمة الكراسي المحددة!");
    }
</script>

</body>
</html>
